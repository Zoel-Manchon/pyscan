[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyscan"
dynamic = ["version"]
description = "A modular, hexagonal port, OT-protocol and traffic scanner with an ICS detection engine."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Zoel Arias Manchón" }]
keywords = [
    "port-scanner",
    "network-security",
    "ics",
    "ot-security",
    "modbus",
    "iec-104",
    "s7comm",
    "packet-capture",
    "hexagonal-architecture",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/Zoel-Manchon/pyscan"
Repository = "https://github.com/Zoel-Manchon/pyscan"
Issues = "https://github.com/Zoel-Manchon/pyscan/issues"

[project.optional-dependencies]
syn = ["scapy>=2.5"]
tui = ["textual>=0.60"]
lab = ["pymodbus>=3.5"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "textual>=0.60",
]

[project.scripts]
pyscan = "pyscan.cli.main:main"

# Single source of truth for the version: the package itself.
[tool.hatch.version]
path = "src/pyscan/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pyscan"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=pyscan --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["src/pyscan"]

[tool.coverage.report]
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
# Adapters that only exist to drive a terminal UI or a raw socket cannot be
# covered without a TTY or root; they are kept thin precisely so that the
# untested surface stays small and obvious.
omit = [
    "src/pyscan/adapters/output/sniff_tui.py",
    "src/pyscan/adapters/output/monitor_tui.py",
    "src/pyscan/adapters/capture/live_capture.py",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Typer's whole API is function calls in argument defaults; B008 is wrong here.
"src/pyscan/cli/main.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["src/pyscan"]
strict = true
warn_unreachable = true
# scapy and textual are optional extras with no bundled stubs; the modules that
# touch them are the only place an import can be missing.
[[tool.mypy.overrides]]
module = ["scapy.*", "textual.*"]
ignore_missing_imports = true
# scapy ships no usable stubs and builds its layers dynamically, so following
# its imports produces noise about attributes that exist perfectly well at run time.
follow_imports = "skip"

[[tool.mypy.overrides]]
# The two Textual views subclass and decorate an untyped third-party API. They
# hold no logic worth type-checking - that all lives in the domain - so the
# strict-mode noise about Any base classes buys nothing here.
module = ["pyscan.adapters.output.sniff_tui", "pyscan.adapters.output.monitor_tui"]
disallow_subclassing_any = false
disallow_untyped_decorators = false

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
