# docker-compose.yml — one service that does everything.
# The menu (./otkit.sh) drives it with `docker compose run --rm otkit <cmd>`.
#
# network_mode: host   -> the container sees the real NIC (required for live
#                         capture). Linux only.
# cap_add NET_RAW/NET_ADMIN -> capture and raw-socket scanning without --privileged.
# The ./otkit volume keeps captures and exported incident reports on your host.

services:
  otkit:
    build:
      context: .
      dockerfile: docker/Dockerfile.otkit
    image: pyscan-otkit:latest
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    stdin_open: true
    tty: true
    working_dir: /app/otkit
    volumes:
      - ./otkit:/app/otkit
