name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default: nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # The scanner talks to sockets, and sockets are where the operating
          # systems differ. One Windows and one macOS job catch what a
          # Linux-only matrix cannot.
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy --strict)
        run: mypy

      - name: Test (pytest + coverage gate)
        run: pytest -q

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # pip itself is part of the audited environment, so it goes first.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,syn,tui,lab]"

      - name: Static analysis (bandit)
        run: bandit -c pyproject.toml -r src/

      - name: Dependency audit (pip-audit)
        # --skip-editable passes over pyscan itself, which is not on PyPI and so
        # has nothing to audit. A real CVE in any dependency still fails the job.
        run: pip-audit --skip-editable --progress-spinner off

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel and sdist
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Install the built wheel and smoke-test the CLI
        run: |
          pip install dist/*.whl
          pyscan strategies
          pyscan lab /tmp/lab.pcap
          pyscan monitor /tmp/lab.pcap --hmi 10.10.30.10 --plc 10.10.30.21,10.10.40.7

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t pyscan:ci .

      - name: Run the CLI from the image
        run: |
          docker run --rm pyscan:ci strategies
          docker run --rm pyscan:ci version
